name: Publish npm package and MCP Registry entry

on:
  release:
    types: [published]

permissions:
  id-token: write # required for npm provenance attestation
  contents: read

jobs:
  publish-npm:
    name: Publish @zktx.io/sui-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the package is publishable and matches the release tag
        env:
          SUI_MCP_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.private === true) {
            throw new Error(`${pkg.name} is marked private and cannot be published`);
          }
          const tag = process.env.SUI_MCP_RELEASE_TAG ?? '';
          const accepted = new Set([`v${pkg.version}`, pkg.version]);
          if (!accepted.has(tag)) {
            throw new Error(
              `release tag "${tag}" does not match ${pkg.name}@${pkg.version} ` +
                `(tag the release "v${pkg.version}" or "${pkg.version}")`,
            );
          }
          console.log(`Publishing ${pkg.name}@${pkg.version} for release "${tag}"`);
          NODE

      - name: Build and verify the publishable package
        # JS-DevTools/npm-publish does not run npm lifecycle scripts, so the build
        # and gate run here explicitly. release:check typechecks, runs tests,
        # builds dist/, and asserts the packed tarball contents (including
        # dist/runtime/start.js) with a packed-tarball smoke install.
        run: npm run release:check

      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: package.json
          access: public
          # Build provenance needs a public repository, so it is enabled only when
          # the repo is public; on a private repo it stays off so the publish still runs.
          provenance: ${{ !github.event.repository.private }}
          # Already-public versions are skipped. A version still being scanned
          # is not public yet; retry the downstream Registry job, not this upload.
          strategy: upgrade
          # Prerelease GitHub releases publish under the `next` dist-tag; stable
          # (non-prerelease) releases publish under `latest`.
          tag: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          # dist/ is built and gated by the release:check step above; this step
          # only packs (per the package "files" field) and publishes that output.

  publish-mcp-registry:
    name: Register on the MCP Registry
    needs: publish-npm
    # Only stable releases create an MCP Registry entry; prereleases still
    # publish to npm under the "next" dist-tag (handled by the job above).
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # Up to 20 minutes for public npm availability, plus the original 10-minute
    # budget for metadata checks, publisher installation and registration.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node for the public npm check
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Publish exactly the metadata that passed the package release check.
      - name: Verify MCP Registry package metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const server = JSON.parse(fs.readFileSync('server.json', 'utf8'));
          if (server.name !== pkg.mcpName || server.version !== pkg.version ||
              server.packages[0].identifier !== pkg.name || server.packages[0].version !== pkg.version) {
            throw new Error('MCP Registry metadata differs from the verified package');
          }
          NODE

      - name: Wait for the published npm version to become public
        run: node scripts/wait-for-npm-publication.ts

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # GitHub OIDC authorizes the io.github.zktx-mcp/* namespace from this
      # repository, so no token or secret is needed (it reuses the workflow-level
      # id-token: write permission). The registry validates ownership against the
      # published package's "mcpName" field, so this job runs after the npm
      # publish job (needs: publish-npm).
      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
